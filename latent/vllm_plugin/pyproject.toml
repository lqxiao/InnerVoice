[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "innervoice_vllm"
version = "0.1"
description = "vLLM plugin: InnerVoice Qwen3 (last-layer two-expert think/answer MLP + disclosure router)"

[project.entry-points."vllm.general_plugins"]
innervoice_vllm = "innervoice_vllm:register"

[tool.setuptools]
packages = ["innervoice_vllm"]
